<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Timer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 2rem 1rem;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f0f0f0; }
  }

  .timer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    max-width: 320px;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }

  #ring-bg   { stroke: #e0e0e0; }
  #ring-fill { stroke: #1D9E75; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear, stroke 0.3s; }

  @media (prefers-color-scheme: dark) {
    #ring-bg { stroke: #333; }
  }

  .ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time-display {
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -1px;
    color: #1a1a1a;
    line-height: 1;
    transition: color 0.3s;
  }
  @media (prefers-color-scheme: dark) {
    .time-display { color: #f0f0f0; }
  }
  .time-display.warning { color: #BA7517 !important; }
  .time-display.danger  { color: #E24B4A !important; }

  .done-msg {
    font-size: 13px;
    color: #888;
    height: 18px;
  }

  .presets {
    display: flex;
    gap: 8px;
  }
  .preset-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: transparent;
    color: #666;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .preset-btn { border-color: #444; color: #aaa; }
    .preset-btn:active { background: #2a2a2a; color: #f0f0f0; }
    .preset-btn.active { background: #2a2a2a; color: #f0f0f0; border-color: #888; }
  }
  .preset-btn:active { background: #f5f5f5; color: #1a1a1a; }
  .preset-btn.active { background: #f5f5f5; color: #1a1a1a; border-color: #aaa; }

  .set-row {
    display: flex;
    align-items: center;
    gap: 18px;
    transition: opacity 0.3s;
  }
  .adj-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid #ddd;
    background: transparent;
    color: #1a1a1a;
    font-size: 22px;
    font-family: inherit;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .adj-btn { border-color: #444; color: #f0f0f0; }
    .adj-btn:active { background: #2a2a2a; }
  }
  .adj-btn:active { background: #f5f5f5; }

  .set-display {
    font-size: 24px;
    font-weight: 500;
    min-width: 75px;
    text-align: center;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    .set-display { color: #f0f0f0; }
  }

  .controls {
    display: flex;
    gap: 10px;
  }
  .ctrl-btn {
    padding: 11px 28px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: transparent;
    color: #1a1a1a;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .ctrl-btn { border-color: #444; color: #f0f0f0; }
    .ctrl-btn:active { background: #2a2a2a; }
    .ctrl-btn.primary { background: #f0f0f0; color: #1a1a1a; border-color: transparent; }
  }
  .ctrl-btn:active { transform: scale(0.97); background: #f5f5f5; }
  .ctrl-btn.primary {
    background: #1a1a1a;
    color: #ffffff;
    border-color: transparent;
  }
  .ctrl-btn.primary:active { opacity: 0.8; }
</style>
</head>
<body>

<div class="timer-wrap">
  <div class="ring-wrap">
    <svg viewBox="0 0 220 220" width="220" height="220" xmlns="http://www.w3.org/2000/svg">
      <circle id="ring-bg"   cx="110" cy="110" r="95" fill="none" stroke-width="10"/>
      <circle id="ring-fill" cx="110" cy="110" r="95" fill="none" stroke-width="10"
              stroke-dasharray="596.9" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-inner">
      <div class="time-display" id="time-display">05:00</div>
      <div class="done-msg" id="done-msg"></div>
    </div>
  </div>

  <div class="presets" id="presets">
    <button class="preset-btn active" data-s="300">5m</button>
    <button class="preset-btn" data-s="600">10m</button>
    <button class="preset-btn" data-s="900">15m</button>
    <button class="preset-btn" data-s="1500">25m</button>
  </div>

  <div class="set-row" id="set-row">
    <button class="adj-btn" id="minus">−</button>
    <div class="set-display" id="set-display">05:00</div>
    <button class="adj-btn" id="plus">+</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" id="start-btn">Start</button>
    <button class="ctrl-btn" id="reset-btn">Reset</button>
  </div>
</div>

<script>
const CIRC = 2 * Math.PI * 95;
var setSeconds = 300;
var remaining  = 300;
var total      = 300;
var running    = false;
var interval   = null;

var display  = document.getElementById('time-display');
var setDisp  = document.getElementById('set-display');
var ring     = document.getElementById('ring-fill');
var startBtn = document.getElementById('start-btn');
var resetBtn = document.getElementById('reset-btn');
var doneMsg  = document.getElementById('done-msg');
var setRow   = document.getElementById('set-row');
var presets  = document.querySelectorAll('.preset-btn');

ring.style.strokeDasharray = CIRC;

function fmt(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function updateRing() {
  var pct = total > 0 ? remaining / total : 0;
  ring.style.strokeDashoffset = CIRC * (1 - pct);
  if (remaining <= 60) {
    ring.style.stroke = '#E24B4A';
    display.className = 'time-display danger';
  } else if (remaining <= total * 0.25) {
    ring.style.stroke = '#EF9F27';
    display.className = 'time-display warning';
  } else {
    ring.style.stroke = '#1D9E75';
    display.className = 'time-display';
  }
}

function render() {
  display.textContent = fmt(remaining);
  updateRing();
}

function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 1.2);
  } catch(e) {}
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval);
    running = false;
    startBtn.textContent = 'Start';
    doneMsg.textContent = 'Done!';
    setRow.style.opacity = '1';
    presets.forEach(function(b) { b.style.pointerEvents = ''; });
    beep();
    return;
  }
  remaining--;
  render();
}

function start() {
  if (remaining <= 0) return;
  running = true;
  doneMsg.textContent = '';
  startBtn.textContent = 'Pause';
  setRow.style.opacity = '0.3';
  presets.forEach(function(b) { b.style.pointerEvents = 'none'; });
  interval = setInterval(tick, 1000);
}

function pause() {
  running = false;
  clearInterval(interval);
  startBtn.textContent = 'Resume';
  setRow.style.opacity = '1';
  presets.forEach(function(b) { b.style.pointerEvents = ''; });
}

function reset() {
  clearInterval(interval);
  running = false;
  remaining = setSeconds;
  total = setSeconds;
  startBtn.textContent = 'Start';
  doneMsg.textContent = '';
  setRow.style.opacity = '1';
  presets.forEach(function(b) { b.style.pointerEvents = ''; });
  render();
}

startBtn.addEventListener('click', function() { running ? pause() : start(); });
resetBtn.addEventListener('click', reset);

document.getElementById('minus').addEventListener('click', function() {
  if (running) return;
  setSeconds = Math.max(60, setSeconds - 60);
  remaining = setSeconds; total = setSeconds;
  setDisp.textContent = fmt(setSeconds);
  doneMsg.textContent = '';
  presets.forEach(function(b) { b.classList.remove('active'); });
  render();
});

document.getElementById('plus').addEventListener('click', function() {
  if (running) return;
  setSeconds = Math.min(5999, setSeconds + 60);
  remaining = setSeconds; total = setSeconds;
  setDisp.textContent = fmt(setSeconds);
  doneMsg.textContent = '';
  presets.forEach(function(b) { b.classList.remove('active'); });
  render();
});

presets.forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (running) return;
    setSeconds = parseInt(btn.dataset.s);
    remaining = setSeconds; total = setSeconds;
    setDisp.textContent = fmt(setSeconds);
    doneMsg.textContent = '';
    presets.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });
});

render();
</script>
</body>
</html>
